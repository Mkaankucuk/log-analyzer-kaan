<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <title>{{ t("security_page_title") }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="dashboard-page">

<div class="layout">
    {% include 'partials/menu.html' %}

    <main class="main-content">
        <div class="dashboard">

            <section class="section-box">
                <h1 class="section-title">{{ t("security_page_title") }}</h1>

                <div class="cards">
                    <div class="card">
                        <h3>{{ t("total_security_logs") }}</h3>
                        <p>{{ summary.total_logs }}</p>
                    </div>
                </div>
            </section>

            <section class="section-box">
                <h2 class="sub-title">{{ t("status_distribution") }}</h2>
                <div class="chart-container">
                    <div id="statusChart"></div>
                </div>
            </section>

            <section class="section-box">
                <h2 class="sub-title">{{ t("error_type_distribution") }}</h2>
                <div class="chart-container">
                    <div id="errorTypeChart"></div>
                </div>
            </section>

            <section class="section-box">
                <h2 class="sub-title">{{ t("latency_trend") }}</h2>

                <div class="chart-container">
                    <div id="latencyChart"></div>
                </div>

                <div class="latency-filter-box">
                    <div class="filter-group">
                        <label for="latencyInterval">{{ t("time_interval") }}</label>
                        <select id="latencyInterval">
                            <option value="hour" {% if selected_interval == 'hour' %}selected{% endif %}>{{ t("hourly") }}</option>
                            <option value="day" {% if selected_interval == 'day' %}selected{% endif %}>{{ t("daily") }}</option>
                        </select>
                    </div>

                    <div class="filter-actions">
                        <button id="applySecurityFilter" type="button">{{ t("filter_button") }}</button>
                    </div>
                </div>
            </section>

        </div>
    </main>
</div>

<script>
    window.i18n = {{ js_translations | tojson }};
    window.securityChartData = {
        statusChart: {{ status_chart | safe }},
        errorTypeChart: {{ error_type_chart | safe }},
        latencyChart: {{ latency_chart | safe }}
    };
</script>
<script src="{{ url_for('static', filename='js/security_logs.js') }}"></script>

</body>
</html>
