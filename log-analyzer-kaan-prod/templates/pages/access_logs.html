<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Access Logs Grafik</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="dashboard-page">

<div class="layout">
    {% include 'partials/menu.html' %}

    <main class="main-content">
        <div class="dashboard">
            <section class="section-box">
                <h2 class="section-title">Access Logs Grafik</h2>

                <div class="chart-box">
                    <h3>Filtreler</h3>

                    <div class="filter-panel">
                        <div class="filter-group">
                            <label>Method</label>
                            <div class="filter-inline">
                                {% for method in filter_methods %}
                                <label>
                                    <input type="checkbox" class="method-checkbox" value="{{ method }}" checked>
                                    {{ method }}
                                </label>
                                {% endfor %}
                            </div>
                        </div>

                        <div class="filter-group">
                            <label for="statusGroupFilter">Status Grubu</label>
                            <select id="statusGroupFilter">
                                <option value="">Tümü</option>
                                <option value="2xx">2xx</option>
                                <option value="3xx">3xx</option>
                                <option value="4xx">4xx</option>
                                <option value="5xx">5xx</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="statusCodeFilter">Status Kodu</label>
                            <select id="statusCodeFilter">
                                <option value="">Tümü</option>
                                {% for code in filter_status_codes %}
                                <option value="{{ code }}">{{ code }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="endpointFilter">Endpoint</label>
                            <select id="endpointFilter">
                                <option value="all">Tümü</option>
                                {% for ep in filter_endpoints %}
                                <option value="{{ ep }}">{{ ep }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="intervalFilter">Zaman Kırılımı</label>
                            <select id="intervalFilter">
                                <option value="hour">Saatlik</option>
                                <option value="day">Günlük</option>
                            </select>
                        </div>

                        <div class="filter-actions">
                            <button type="button" id="applyFiltersBtn">Filtrele</button>
                            <button type="button" id="resetFiltersBtn">Sıfırla</button>
                        </div>
                    </div>
                </div>

                <div class="chart-box">
                    <h3>İstek Tipine Göre Log Grafiği</h3>
                    <div id="requestMethodChart"></div>
                </div>

                <div class="chart-box">
                    <h3>Request and Error Sayıları</h3>
                    <div id="requestErrorChart"></div>
                </div>

                <div class="chart-box">
                    <h3>Ortalama Latency Sayıları</h3>
                    <div id="latencyChart"></div>
                </div>
            </section>
        </div>
    </main>
</div>

<script id="access-logs-initial-data" type="application/json">
    {{ {
        "method_chart_data": method_chart_data,
        "request_error_chart": request_error_chart,
        "latency_chart": latency_chart
    } | tojson }}
</script>
<script src="{{ url_for('static', filename='js/access_logs.js') }}"></script>

</body>
</html>
